apis:
- aid: scalar-api:scalar-api-reference
  name: Scalar API Reference
  tags:
  - API Reference
  - API Documentation
  - Open Source
  - OpenAPI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://guides.scalar.com/scalar/scalar-api-references/getting-started
  properties:
  - url: https://guides.scalar.com/scalar/scalar-api-references/getting-started
    type: Documentation
  - url: https://github.com/scalar/scalar/blob/main/packages/api-reference/README.md
    type: SourceCode
  description: Open-source (MIT) renderer that turns an OpenAPI/Swagger or AsyncAPI
    document into an interactive API reference with a built-in request-testing panel
    and multi-language code samples. Embeds from a single HTML file or as the
    @scalar/api-reference npm package, and ships as the default docs UI in dozens of
    frameworks. This is a self-hosted component library, not a hosted REST API -
    surface documented as a capability area (endpointsModeled).
- aid: scalar-api:scalar-api-client
  name: Scalar API Client
  tags:
  - API Client
  - Testing
  - Developer Tools
  - Open Source
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://guides.scalar.com/scalar/scalar-api-client/getting-started
  properties:
  - url: https://guides.scalar.com/scalar/scalar-api-client/getting-started
    type: Documentation
  - url: https://github.com/scalar/scalar
    type: SourceCode
  description: Fully open-source, offline-first API client built on the OpenAPI
    standard - a Postman/Insomnia alternative for sending REST, GraphQL, and
    WebSocket requests, organizing collections and environments, running pre/after
    request scripts, and executing collection runners. Available as a desktop app
    (Windows, macOS, Linux) and in the browser. Consumer-side developer tool, not a
    hosted API (endpointsModeled).
- aid: scalar-api:scalar-registry-api
  name: Scalar Registry API
  tags:
  - Registry
  - OpenAPI
  - Versioning
  - Developer Tools
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://guides.scalar.com/scalar/scalar-registry/getting-started
  baseURL: https://registry.scalar.com
  properties:
  - url: https://guides.scalar.com/scalar/scalar-registry/getting-started
    type: Documentation
  - url: https://guides.scalar.com/scalar/scalar-registry/cli
    type: APIReference
  - url: openapi/scalar-api-openapi.yml
    type: OpenAPI
  - url: collections/scalar-api.postman_collection.json
    type: PostmanCollection
  - url: collections/scalar-api.opencollection.json
    type: OpenCollection
  description: Hosted registry that stores and versions OpenAPI documents. Published
    documents are served over a public HTTPS read CDN in the form
    registry.scalar.com/@{namespace}/apis/{slug} (append ?format=json/yaml), which
    powers hosted docs and CI/CD. Publishing, updating, and deleting documents is
    performed through the authenticated Scalar CLI (API key), which wraps the
    platform's internal API - a fully documented public REST management API is not
    published, so mutating operations are modeled here (endpointsModeled).
- aid: scalar-api:scalar-docs-platform
  name: Scalar Docs Platform
  tags:
  - API Documentation
  - Developer Portal
  - Git Sync
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://guides.scalar.com/scalar/scalar-docs/getting-started
  properties:
  - url: https://guides.scalar.com/scalar/scalar-docs/getting-started
    type: Documentation
  - url: https://scalar.com/products/docs/getting-started
    type: SignUp
  description: Hosted developer-portal product that combines Markdown/MDX guides with
    generated API references, custom domains and subdomains, themes, versions, and
    two-way Git Sync from GitHub. Content is deployed via dashboard.scalar.com or
    automated GitHub workflows. Hosted SaaS surface, not a public REST API
    (endpointsModeled).
- aid: scalar-api:scalar-cli
  name: Scalar CLI
  tags:
  - CLI
  - Developer Tools
  - Open Source
  - OpenAPI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://guides.scalar.com/scalar/scalar-registry/cli
  properties:
  - url: https://guides.scalar.com/scalar/scalar-registry/cli
    type: Documentation
  - url: https://www.npmjs.com/package/@scalar/cli
    type: SourceCode
  description: Open-source command-line tool (@scalar/cli) for validating and linting
    OpenAPI documents (Spectral rules), previewing references, and publishing/listing/
    updating/deleting documents in the Scalar Registry (scalar registry publish,
    list, update, delete; scalar document validate, lint; scalar team list/set).
    Authenticates with a Scalar API key. Command-line surface, not an HTTP API
    (endpointsModeled).
- aid: scalar-api:scalar-sdk-generation
  name: Scalar SDK Generation
  tags:
  - SDK
  - Code Generation
  - OpenAPI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://scalar.com/products/sdks
  properties:
  - url: https://scalar.com/products/sdks
    type: Documentation
  description: Hosted SDK generation that produces type-safe client libraries from an
    OpenAPI document for TypeScript, Python, Go, Java, PHP, C#, and Ruby, kept in sync
    with the registry. Paid add-on on the hosted platform (per-language). Generation
    workflow, not a standalone public REST API (endpointsModeled).
- aid: scalar-api:scalar-agent-mcp
  name: Scalar Agent and MCP
  tags:
  - AI
  - MCP
  - Agent
  - Developer Tools
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://scalar.com/products/agent
  properties:
  - url: https://scalar.com/products/agent
    type: Documentation
  - url: https://scalar.com/products/agent/pricing
    type: Plans
  description: AI layer that lets developers chat with an API inside the docs and
    exposes hosted MCP (Model Context Protocol) servers generated from an OpenAPI
    document so agents can call the API. Metered in Agent Scalar credits. Hosted AI/MCP
    capability area (endpointsModeled).
- aid: scalar-api:scalar-galaxy-api
  name: Scalar Galaxy API
  tags:
  - Example API
  - REST
  - OpenAPI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://galaxy.scalar.com
  baseURL: https://galaxy.scalar.com
  properties:
  - url: https://registry.scalar.com/@scalar/apis/galaxy?format=json
    type: OpenAPI
  - url: https://github.com/scalar/scalar/tree/main/packages/galaxy
    type: SourceCode
  description: Scalar Galaxy is Scalar's live, fictional example REST API (planets,
    celestial bodies, users, authentication) published as an OpenAPI 3.1.1 document
    and served at galaxy.scalar.com. It exists to test OpenAPI tooling and to demo the
    API Reference and API Client. This is a real, publicly reachable REST API used for
    demonstration.
