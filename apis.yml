name: Scalar
kind: company
description: Scalar is an open-source (MIT) API platform built on the OpenAPI standard.
  Its core is a self-hostable API Reference renderer that turns an OpenAPI or AsyncAPI
  document into a beautiful, interactive reference with a built-in API testing tool,
  plus a fully open-source, offline-first API Client (a Postman alternative available
  as a desktop app and in the browser). On top of the open-source components Scalar
  runs a hosted SaaS platform (dashboard.scalar.com) providing an API Registry that
  stores and versions OpenAPI documents behind a public read CDN (registry.scalar.com),
  a Docs product for developer portals with Git Sync and Markdown/MDX, SDK generation
  for TypeScript, Python, Go, Java, PHP, C#, and Ruby, hosted MCP servers, and an AI
  Agent for chatting with APIs. Scalar is the default API documentation UI for many
  frameworks (FastAPI, Hono, Elysia, NestJS, Laravel, and others). Publishing to the
  hosted registry is done through the Scalar CLI; the registry read surface and the
  Galaxy example API are public over HTTPS.
