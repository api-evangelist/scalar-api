  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Scalar
serviceCategory: Developer Tools and API Documentation
billingModel:
  pricingCategory: Subscription and Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Scalar
  ServiceCategory: Developer Tools and API Documentation
  ProviderName: Scalar
  PublisherName: Scalar
