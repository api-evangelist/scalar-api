meters:
- name: pro_subscription
  description: Monthly Pro subscription to the hosted Scalar platform.
  unit: months
  aggregation: sum
  dimensions:
  - account
- name: sdk_languages
  description: Per-language SDK generation add-ons billed on top of a paid plan.
  unit: languages
  aggregation: sum
  dimensions:
  - account
- name: agent_credits
  description: Agent Scalar credits consumed by the AI Agent and hosted MCP servers.
  unit: credits
  aggregation: sum
  dimensions:
  - account
- name: self_hosted_compute
  description: Infrastructure cost of running the MIT-licensed Scalar components (no Scalar invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track the Pro/Enterprise subscription, the count of SDK languages generated, and Agent credit consumption; on self-hosted, monitor hosting cost for the renderer and docs.
- name: Allocation
  description: Map registry namespaces and developer portals to teams so subscription and Agent-credit spend maps to internal cost centers.
- name: Optimization
  description: Self-host the open-source renderer and API Client when hosted features are not needed; generate SDKs only for languages actually consumed; scope Agent usage to control credit burn.
- name: Accountability
  description: Assign an owner per portal/namespace and review monthly subscription, SDK, and Agent-credit spend against budget.
