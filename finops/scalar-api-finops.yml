description: >-
  FinOps view of Scalar spend. Scalar's core is open source (MIT) and free to
  self-host - in that model the only cost is your own compute and hosting for
  the API Reference renderer, API Client, and CLI, with no vendor invoice. The
  hosted Scalar platform is billed as a Free tier, a Pro subscription (72 USD
  per month), and custom Enterprise agreements, with per-language SDK generation
  add-ons and AI Agent / MCP usage metered in Agent Scalar credits. The dominant
  variable costs on the hosted side are the Pro/Enterprise subscription, the
  number of SDK languages generated, and Agent credit consumption.
notes: >-
  Hosted per-unit rates (Agent credit pricing, per-language SDK pricing) should
  be re-verified on scalar.com/pricing during reconciliation. Self-hosted
  deployments incur infrastructure cost rather than a Scalar license fee.
sources:
- https://scalar.com/pricing
- https://scalar.com/products/agent/pricing
- https://github.com/scalar/scalar
